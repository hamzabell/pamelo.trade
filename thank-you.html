<style>
:root{
  --ff-display:'Cormorant Garamond',serif;--ff-body:'DM Sans',sans-serif;
  --ink:#0D0D1C;--ink2:#50507A;--ink3:#9898B8;
  --p:#7C5CFC;--p-dk:#6344e0;--p-lt:#F2EFFE;--p-bd:#DDD5FD;--white:#fff;
  --grn:#12B76A;--grn-lt:#ECFDF5;--grn-bd:#A6F4C5;
  --bg:#F8F8FC;--bd:#E8E8F0;
  --r:12px;--rsm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
svg{display:block}

/* NAV */
.nav-shell{border-bottom:1px solid var(--bd);background:var(--white)}
.nav{max-width:500px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:8px}
.logomark{display:flex;align-items:center;gap:8px}
.logotype{font-family:var(--ff-display);font-size:18px;font-weight:300;letter-spacing:-0.5px;color:var(--ink)}
.logotype em{font-style:italic;color:var(--p)}

/* MAIN */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 22px}
.card{max-width:400px;width:100%;text-align:center}
.icon-wrap{width:56px;height:56px;background:var(--grn-lt);border:1.5px solid var(--grn-bd);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.heading{font-family:var(--ff-display);font-size:28px;font-weight:500;color:var(--ink);line-height:1.2;margin-bottom:12px}
.sub{font-size:15px;color:var(--ink2);line-height:1.65;margin-bottom:32px}
.btn-home{display:inline-block;background:var(--p);color:#fff;border-radius:var(--rsm);padding:12px 24px;font-family:inherit;font-size:14px;font-weight:600;text-decoration:none;transition:background .15s}
.btn-home:hover{background:var(--p-dk)}
</style>
</head>
<body>

<div class="nav-shell">
  <nav class="nav">
    <div class="logomark">
      <svg width="30" height="30" viewBox="0 0 80 80" fill="none">
        <rect width="80" height="80" rx="22" fill="url(#navg)"/>
        <path d="M26 56 L26 24" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <path d="M26 24 Q26 18 32 18 L44 18 Q54 18 54 30 Q54 42 44 42 L26 42" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="54" cy="56" r="5" fill="#C4A8E8"/>
        <defs>
          <linearGradient id="navg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4C35A0"/>
            <stop offset="100%" stop-color="#2D1B69"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="logotype">pame<em>lo</em></div>
    </div>
  </nav>
</div>

<main>
  <div class="card">
    <div class="icon-wrap">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#12B76A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="heading">You're on the list.</p>
    <p class="sub">We'll reach out on WhatsApp within 48 hours to learn more about your business.</p>
    <a href="index.html" class="btn-home">Back to home</a>
  </div>
</main>

</body>
